[project]
name = "tradingbot"
version = "0.1.0"
description = "Paper-trading-first crypto trading bot: backtesting, walk-forward validation, risk management, Binance adapter."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
