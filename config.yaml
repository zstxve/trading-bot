# =============================================================================
# TradingBot configuration
# =============================================================================
# Secrets (API keys) do NOT live here — they come from environment variables,
# see .env.example. Unknown/misspelled keys anywhere in this file fail loudly
# at startup (strict validation).
#
# mode: backtest | paper | live
# "live" additionally requires: live.enabled=true, the TRADINGBOT_LIVE_ACK env
# var, and the --i-really-want-live CLI flag. Paper is the default.
mode: paper

data:
  source: binance            # binance | synthetic (synthetic = offline test data)
  symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT", "BNB/USDT"]
  timeframe: "1h"            # signal timeframe
  history_days: 730
  cache_dir: "data_cache"

strategy:
  active: trend_ma_cross     # trend_ma_cross | meanrev_rsi_bb
  trend_ma_cross:
    fast_ema: 20
    slow_ema: 50
    regime_timeframe: "4h"   # higher-timeframe trend filter (causally aligned)
    regime_ema: 50
    atr_n: 14
    atr_stop_mult: 3.0
    trail_stop: true         # chandelier-style trailing stop
    atr_pct_min: 0.003       # skip dead markets (ATR < 0.3% of price)
    atr_pct_max: 0.08        # skip panic regimes (ATR > 8% of price)
  meanrev_rsi_bb:
    rsi_n: 14
    rsi_buy: 30.0            # oversold threshold
    rsi_exit: 55.0
    bb_n: 20
    bb_k: 2.0
    regime_timeframe: "4h"
    regime_ema: 50           # only buy dips while above the 4h EMA (uptrend)
    atr_n: 14
    atr_stop_mult: 2.0
    max_hold_bars: 48        # time stop: 2 days on 1h bars

risk:
  risk_per_trade: 0.005      # 0.5% of equity risked between entry and stop
  max_drawdown: 0.15         # HARD limit: kill switch engages, everything flattens
  daily_loss_limit: 0.02     # halt new entries for the rest of the UTC day
  max_open_positions: 4
  max_asset_exposure: 0.25   # max notional per symbol / equity
  max_total_exposure: 0.80   # max total notional / equity
  leverage: 1.0              # spot, long-only. >1 refused unless allow_leverage
  allow_leverage: false
  min_order_notional: 10.0   # Binance spot minimum order (USDT)
  max_consecutive_api_errors: 5   # kill switch trigger in the live/paper loop
  stale_data_factor: 2.0     # kill switch if newest bar older than 2x timeframe

costs:
  # Binance spot taker fee 0.10% per side + assumed slippage + half spread.
  # Round trip on these numbers costs ~0.34% + spread — the backtest pays it.
  fee_bps: 10.0
  slippage_bps: 5.0
  half_spread_bps: 2.0
  # Latency model: a signal computed on a bar CLOSE executes at the NEXT bar
  # OPEN. There is no same-bar execution anywhere in the system.

backtest:
  initial_capital: 10000.0
  periods_per_year: 8760     # 1h bars, 24/7 crypto market
  oos_fraction: 0.2          # final 20% of history held out as out-of-sample

walkforward:
  train_bars: 4320           # ~6 months of 1h bars
  test_bars: 1440            # ~2 months tested out-of-sample, then roll forward
  min_trades: 8              # parameter sets with fewer train trades are rejected
  grids:                     # deliberately SMALL grids — see README on overfitting
    trend_ma_cross:
      fast_ema: [10, 20, 30]
      slow_ema: [50, 100]
      atr_stop_mult: [2.0, 3.0]
    meanrev_rsi_bb:
      rsi_buy: [25.0, 30.0, 35.0]
      bb_k: [2.0, 2.5]
      atr_stop_mult: [1.5, 2.0]

live:
  enabled: false             # real-money master switch. Keep false.
  exchange: binance
  poll_seconds: 60           # stop-loss price poll between bar closes
  bar_close_buffer_seconds: 10
  state_dir: "state"         # paper/live state + KILL_SWITCH file live here

logging:
  level: INFO
  dir: "logs"
  json_logs: false           # true = machine-readable JSON lines in the log file
