# =============================================================================
# Daily-timeframe research configuration
# =============================================================================
# Same system, 1d bars: ~20x fewer trades than 1h, so fees stop dominating,
# and 8 years of history instead of 2. Walk-forward windows are sized in
# DAYS here (train 365 bars = 1 year, test 120 bars = ~4 months).
#
# 2026-07-10 walk-forward OOS (~6y stitched): breakout_donchian long-only
# was the only variant passing the README go/no-go screen (Sharpe 1.11,
# PF 5.76, maxDD -12%, 123 trades, stable params) — hence it is the active
# strategy here and the paper-trading candidate. Expect live to be worse.
mode: paper

data:
  source: binance
  symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT", "BNB/USDT"]
  timeframe: "1d"
  history_days: 2920           # ~8 years (SOL starts 2020 — engine handles it)
  cache_dir: "data_cache"

strategy:
  active: breakout_donchian
  trend_ma_cross:
    # Base params aligned with the dominant walk-forward choice (2026-07-16:
    # fast 10 / slow 50 / mult 2 picked in most windows, Sharpe 0.99 OOS).
    # The walkforward grid still explores around these.
    fast_ema: 10
    slow_ema: 50
    regime_timeframe: "1d"     # price vs its own slow daily EMA
    regime_ema: 100
    atr_n: 14
    atr_stop_mult: 2.0
    trail_stop: true
    atr_pct_min: 0.005
    atr_pct_max: 0.15
    allow_short: false
  meanrev_rsi_bb:
    rsi_n: 14
    rsi_buy: 30.0
    rsi_exit: 55.0
    bb_n: 20
    bb_k: 2.0
    regime_timeframe: "1d"
    regime_ema: 100
    atr_n: 14
    atr_stop_mult: 2.0
    max_hold_bars: 10          # 10 DAYS on this timeframe
  breakout_donchian:
    entry_n: 55                # classic turtle-style channel
    exit_n: 20
    atr_n: 14
    atr_stop_mult: 3.0
    regime_timeframe: "1d"
    regime_ema: 100
    regime_filter: true
    allow_short: false

risk:
  risk_per_trade: 0.005
  max_drawdown: 0.15
  daily_loss_limit: 0.02
  max_open_positions: 4
  max_asset_exposure: 0.25
  max_total_exposure: 0.80
  leverage: 1.0
  allow_leverage: false
  allow_short: false
  min_order_notional: 10.0
  max_consecutive_api_errors: 5
  stale_data_factor: 2.0

costs:
  fee_bps: 10.0
  slippage_bps: 5.0
  half_spread_bps: 2.0
  short_borrow_bps_per_day: 3.0

backtest:
  initial_capital: 10000.0
  periods_per_year: 365        # 1d bars
  oos_fraction: 0.2

walkforward:
  train_bars: 365              # optimise on 1 year of daily bars
  test_bars: 120               # trade ~4 months forward, then roll
  min_trades: 5
  grids:
    trend_ma_cross:
      fast_ema: [10, 20, 30]
      slow_ema: [50, 100, 200]
      atr_stop_mult: [2.0, 3.0]
    meanrev_rsi_bb:
      rsi_buy: [25.0, 30.0, 35.0]
      bb_k: [2.0, 2.5]
      atr_stop_mult: [1.5, 2.0]
    breakout_donchian:
      entry_n: [20, 55]
      exit_n: [10, 20]
      atr_stop_mult: [2.0, 3.0]

live:
  enabled: false
  exchange: binance
  poll_seconds: 60
  bar_close_buffer_seconds: 10
  state_dir: "state"
  dashboard_refresh_seconds: 300   # intra-bar dashboard refresh w/ live marks

logging:
  level: INFO
  dir: "logs"
  json_logs: false

alerts:
  telegram_enabled: false
  notify_trades: true
  daily_summary: true
